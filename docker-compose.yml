services:
  mysql:
    image: mysql:8.4
    container_name: storagehub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: storagehub_local
    ports:
      - "3306:3306"
    volumes:
      - storagehub_mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: storagehub-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: 1234
    ports:
      - "8085:80"
    depends_on:
      - mysql

volumes:
  storagehub_mysql_data:
