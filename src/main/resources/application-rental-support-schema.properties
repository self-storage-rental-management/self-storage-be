# Explicit schema rollout only. No implicit local/shared datasource and no feature activation.
spring.datasource.url=${STORAGEHUB_DB_URL}
spring.datasource.username=${STORAGEHUB_DB_USERNAME}
spring.datasource.password=${STORAGEHUB_DB_PASSWORD}
storagehub.schema-rollout.expected-database=${STORAGEHUB_SCHEMA_ROLLOUT_DATABASE}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/paymentmigration
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.jpa.hibernate.ddl-auto=validate
app.bootstrap-demo-data.enabled=false
app.bootstrap-admin.enabled=false
app.login-history.backfill-fingerprints=false
storagehub.integration.ledger.enabled=false
storagehub.integration.communication.enabled=false
storagehub.integration.rental-period.enabled=false
storagehub.integration.renewal-operational-checks.enabled=false
