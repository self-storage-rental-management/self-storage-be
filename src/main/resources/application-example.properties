spring.datasource.url=jdbc:mysql://localhost:3306/storagehub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=YOUR_MYSQL_USERNAME
spring.datasource.password=YOUR_MYSQL_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=false

app.jwt.secret=REPLACE_WITH_A_BASE64_SECRET_AT_LEAST_32_BYTES_LONG
app.jwt.expiration=3600
app.jwt.refresh-expiration=604800
app.cors.allowed-origin=http://localhost:5173,http://localhost:8443
app.payment.webhook-secret=REPLACE_WITH_PAYMENT_WEBHOOK_SECRET
app.files.storage-path=./uploads
app.files.max-size-bytes=10485760
app.mail.enabled=false
app.mail.from=no-reply@storagehub.local
app.mail.support-email=support@storagehub.vn
app.mail.company-address=Tòa nhà StorageHub, Khu Công Nghệ Cao, TP.HCM
app.mail.logo-url=
app.mail.frontend-base-url=http://localhost:8443
app.mail.login-url=http://localhost:8443/login
app.mail.security-url=http://localhost:8443/profile/security
app.mail.account-url=http://localhost:8443/profile
app.auth.verification-url=http://localhost:8443/verify-email?token=
app.auth.password-reset-url=http://localhost:8443/reset-password?token=
app.auth.challenge-expiry-minutes=15
app.auth.expose-development-code=false
app.bootstrap-admin.enabled=false
app.bootstrap-admin.reset-password=false
app.bootstrap-admin.email=
app.bootstrap-admin.password=
app.bootstrap-admin.full-name=StorageHub Administrator
spring.mail.host=YOUR_SMTP_HOST
spring.mail.port=587
spring.mail.username=YOUR_SMTP_USERNAME
spring.mail.password=YOUR_SMTP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
