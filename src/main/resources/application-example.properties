spring.datasource.url=jdbc:mysql://localhost:3306/storagehub_local?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=YOUR_MYSQL_USERNAME
spring.datasource.password=YOUR_MYSQL_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=REPLACE_WITH_A_BASE64_SECRET_AT_LEAST_32_BYTES_LONG
app.jwt.expiration=3600
app.jwt.refresh-expiration=604800
app.cors.allowed-origin=http://localhost:5173,http://localhost:8443
app.payment.simulation-outcome=SUCCESS
app.files.storage-path=./uploads
app.files.max-size-bytes=10485760
app.mail.enabled=false
app.mail.from=no-reply@storagehub.local
app.auth.verification-url=http://localhost:5173/?verifyEmail=
app.auth.password-reset-url=http://localhost:5173/?resetPassword=
app.auth.expose-development-code=false
app.bootstrap-admin.enabled=false
app.bootstrap-admin.reset-password=false
app.bootstrap-admin.email=
app.bootstrap-admin.password=
app.bootstrap-admin.full-name=StorageHub Administrator
spring.mail.host=YOUR_SMTP_HOST
spring.mail.port=587
spring.mail.username=YOUR_SMTP_USERNAME
spring.mail.password=YOUR_SMTP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
