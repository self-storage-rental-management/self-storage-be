spring.datasource.url=jdbc:mysql://localhost:3306/storagehub?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=YOUR_MYSQL_USERNAME
spring.datasource.password=YOUR_MYSQL_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=REPLACE_WITH_A_BASE64_SECRET_AT_LEAST_32_BYTES_LONG
app.jwt.expiration=3600
app.cors.allowed-origin=http://localhost:5173
app.payment.webhook-secret=REPLACE_WITH_PAYMENT_WEBHOOK_SECRET
app.files.storage-path=./uploads
app.files.max-size-bytes=10485760
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
