spring.datasource.url=${STORAGEHUB_DB_URL}
spring.datasource.username=${STORAGEHUB_DB_USERNAME}
spring.datasource.password=${STORAGEHUB_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=com.storagehub.config.TiDbMySqlDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2026100200
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
app.bootstrap-demo-data.enabled=false

app.jwt.secret=${STORAGEHUB_JWT_SECRET}
app.cors.allowed-origin=${STORAGEHUB_ALLOWED_ORIGIN}
app.auth.expose-development-code=false

app.mail.enabled=${STORAGEHUB_MAIL_ENABLED:true}
app.mail.from=${STORAGEHUB_MAIL_FROM}
app.mail.support-email=${STORAGEHUB_MAIL_SUPPORT}
app.mail.company-address=${STORAGEHUB_MAIL_COMPANY_ADDRESS}
app.mail.logo-url=${STORAGEHUB_MAIL_LOGO_URL}
app.mail.frontend-base-url=${STORAGEHUB_FRONTEND_BASE_URL}
app.mail.login-url=${STORAGEHUB_LOGIN_URL}
app.mail.security-url=${STORAGEHUB_SECURITY_URL}
app.mail.account-url=${STORAGEHUB_ACCOUNT_URL}
app.auth.verification-url=${STORAGEHUB_VERIFICATION_URL}
app.auth.password-reset-url=${STORAGEHUB_PASSWORD_RESET_URL}

spring.mail.host=${STORAGEHUB_MAIL_HOST}
spring.mail.port=${STORAGEHUB_MAIL_PORT:587}
spring.mail.username=${STORAGEHUB_MAIL_USERNAME}
spring.mail.password=${STORAGEHUB_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${STORAGEHUB_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${STORAGEHUB_MAIL_SMTP_STARTTLS:true}
