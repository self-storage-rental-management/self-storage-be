spring.application.name=storagehub
spring.datasource.url=${STORAGEHUB_DB_URL:jdbc:mysql://localhost:3306/storagehub?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${STORAGEHUB_DB_USERNAME:YOUR_MYSQL_USERNAME}
spring.datasource.password=${STORAGEHUB_DB_PASSWORD:YOUR_MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=${STORAGEHUB_JWT_SECRET:REPLACE_WITH_A_BASE64_SECRET_AT_LEAST_32_BYTES_LONG}
app.jwt.expiration=${STORAGEHUB_JWT_EXPIRATION:3600}
app.cors.allowed-origin=${STORAGEHUB_ALLOWED_ORIGIN:http://localhost:5173}
app.payment.webhook-secret=${STORAGEHUB_PAYMENT_WEBHOOK_SECRET:REPLACE_WITH_PAYMENT_WEBHOOK_SECRET}
app.files.storage-path=${STORAGEHUB_FILE_STORAGE_PATH:./uploads}
app.files.max-size-bytes=${STORAGEHUB_FILE_MAX_SIZE_BYTES:10485760}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.error.include-message=never
server.error.include-stacktrace=never
