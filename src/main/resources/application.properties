spring.application.name=storagehub

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/storagehub?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

server.error.include-message=never
server.error.include-stacktrace=never
