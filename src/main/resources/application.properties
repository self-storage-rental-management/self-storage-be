spring.application.name=storagehub
spring.datasource.url=${STORAGEHUB_DB_URL:jdbc:mysql://localhost:3306/storagehub_local?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${STORAGEHUB_DB_USERNAME:YOUR_MYSQL_USERNAME}
spring.datasource.password=${STORAGEHUB_DB_PASSWORD:YOUR_MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2026100200
spring.flyway.validate-on-migrate=true
app.bootstrap-demo-data.enabled=true

app.jwt.secret=${STORAGEHUB_JWT_SECRET:REPLACE_WITH_A_BASE64_SECRET_AT_LEAST_32_BYTES_LONG}
app.jwt.expiration=${STORAGEHUB_JWT_EXPIRATION:3600}
app.jwt.refresh-expiration=${STORAGEHUB_JWT_REFRESH_EXPIRATION:604800}
app.google.client-id=${STORAGEHUB_GOOGLE_CLIENT_ID:}
app.cors.allowed-origin=${STORAGEHUB_ALLOWED_ORIGIN:http://localhost:5173,http://localhost:8443}
app.payment.simulation-outcome=${STORAGEHUB_PAYMENT_SIMULATION_OUTCOME:SUCCESS}
app.reservation.expiration-check-ms=${STORAGEHUB_EXPIRATION_CHECK_MS:1000}
app.reservation.expiration-initial-delay-ms=${STORAGEHUB_EXPIRATION_INITIAL_DELAY_MS:1000}
app.reservation.payment-window-minutes=${STORAGEHUB_PAYMENT_WINDOW_MINUTES:1440}
app.reservation.complaint-window-minutes=${STORAGEHUB_COMPLAINT_WINDOW_MINUTES:30}
app.files.storage-path=${STORAGEHUB_FILE_STORAGE_PATH:./uploads}
app.files.max-size-bytes=${STORAGEHUB_FILE_MAX_SIZE_BYTES:10485760}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
app.mail.enabled=${STORAGEHUB_MAIL_ENABLED:false}
app.mail.from=${STORAGEHUB_MAIL_FROM:no-reply@storagehub.local}
app.mail.support-email=${STORAGEHUB_MAIL_SUPPORT:support@storagehub.vn}
app.mail.company-address=${STORAGEHUB_MAIL_COMPANY_ADDRESS:Tòa nhà StorageHub, Khu Công Nghệ Cao, TP.HCM}
app.mail.logo-url=${STORAGEHUB_MAIL_LOGO_URL:}
app.mail.frontend-base-url=${STORAGEHUB_FRONTEND_BASE_URL:http://localhost:8443}
app.mail.login-url=${STORAGEHUB_LOGIN_URL:http://localhost:8443/login}
app.mail.security-url=${STORAGEHUB_SECURITY_URL:http://localhost:8443/profile/security}
app.mail.account-url=${STORAGEHUB_ACCOUNT_URL:http://localhost:8443/profile}
app.security.alert-cooldown-hours=${STORAGEHUB_SECURITY_ALERT_COOLDOWN_HOURS:6}
app.login-history.backfill-fingerprints=${STORAGEHUB_BACKFILL_FINGERPRINTS:true}
app.auth.verification-url=${STORAGEHUB_VERIFICATION_URL:http://localhost:8443/verify-email?token=}
app.auth.password-reset-url=${STORAGEHUB_PASSWORD_RESET_URL:http://localhost:8443/reset-password?token=}
app.auth.challenge-expiry-minutes=${STORAGEHUB_CHALLENGE_EXPIRY_MINUTES:15}
app.auth.expose-development-code=${STORAGEHUB_EXPOSE_DEVELOPMENT_CODE:false}
app.bootstrap-admin.enabled=${STORAGEHUB_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.reset-password=${STORAGEHUB_BOOTSTRAP_ADMIN_RESET_PASSWORD:false}
app.bootstrap-admin.email=${STORAGEHUB_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${STORAGEHUB_BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.full-name=${STORAGEHUB_BOOTSTRAP_ADMIN_FULL_NAME:StorageHub Administrator}
spring.mail.host=${STORAGEHUB_MAIL_HOST:}
spring.mail.port=${STORAGEHUB_MAIL_PORT:587}
spring.mail.username=${STORAGEHUB_MAIL_USERNAME:}
spring.mail.password=${STORAGEHUB_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${STORAGEHUB_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${STORAGEHUB_MAIL_SMTP_STARTTLS:true}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.error.include-message=never
server.error.include-stacktrace=never
