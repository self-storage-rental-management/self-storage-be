name: Backend checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: be-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - name: Compile and test
        run: ./mvnw -B test
      - name: JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: target/surefire-reports/
          if-no-files-found: ignore

  mysql-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: storagehub_schema_test_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-test-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      STORAGEHUB_SCHEMA_TEST_URL: jdbc:mysql://localhost:3306/storagehub_schema_test_ci?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      STORAGEHUB_SCHEMA_TEST_USERNAME: root
      STORAGEHUB_SCHEMA_TEST_PASSWORD: ci-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - name: Display code migration and concurrency on MySQL
        run: ./mvnw -B -Dtest=BusinessRecordCodesMySqlTests test
      - name: MySQL test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-test-results
          path: target/surefire-reports/
          if-no-files-found: ignore
