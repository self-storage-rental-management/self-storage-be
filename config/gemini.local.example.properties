# Copy to .local/gemini.local.properties (already imported by application.properties).
# Supply GEMINI_API_KEY in the backend process environment; never commit the key.
storagehub.ai.enabled=true
storagehub.ai.provider=gemini
storagehub.ai.api-key=${GEMINI_API_KEY:}
storagehub.ai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
storagehub.ai.model=gemini-3.5-flash-lite
storagehub.ai.temperature=0.2
storagehub.ai.timeout-ms=25000
